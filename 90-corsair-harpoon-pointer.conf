# Keep the transform at identity: scaling it breaks Chromium/X11 pointer lock.
# Use the manually tuned libinput speed without additional DPI scaling.
# See README.md for sensitivity setup.
Section "InputClass"
        Identifier "Corsair Harpoon wired pointer speed"
        MatchDriver "libinput"
        MatchIsPointer "on"
        MatchProduct "Corsair CORSAIR HARPOON RGB WIRELESS Gaming Mouse"
        Option "AccelSpeed" "-0.9"
        Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputClass"
        Identifier "Corsair Harpoon wireless receiver pointer speed"
        MatchDriver "libinput"
        MatchIsPointer "on"
        MatchProduct "Corsair CORSAIR HARPOON RGB WIRELESS USB Receiver"
        Option "AccelSpeed" "-0.8"
        Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputClass"
        Identifier "Corsair Slipstream receiver pointer speed"
        MatchDriver "libinput"
        MatchIsPointer "on"
        MatchProduct "Corsair CORSAIR SLIPSTREAM WIRELESS USB Receiver"
        Option "AccelSpeed" "-0.8"
        Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
